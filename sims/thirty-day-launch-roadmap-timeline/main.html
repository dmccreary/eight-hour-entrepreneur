<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>30-Day Launch Roadmap Timeline using vis-timeline</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <style>
        :root {
            --indigo: #3F51B5;
            --light-indigo: #5C6BC0;
            --fox-orange: #E8791A;
            --dark-orange: #B25A10;
            --correct-green: #2E7D32;
        }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; }

        /* The whole sim is a fixed-height block (CANVAS_HEIGHT in the .js file) */
        #sim {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            height: 560px;
        }

        /* Drawing region: aliceblue with a silver border, matching the other sims in this book */
        #draw {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: aliceblue;
            border: 1px solid silver;
            padding: 8px 10px 10px 10px;
        }
        #title {
            margin: 0 0 2px 0;
            text-align: center;
            font-size: clamp(17px, 4.8vw, 24px);
            font-weight: normal;
            color: black;
        }
        #subtitle {
            margin-bottom: 6px;
            text-align: center;
            font-size: 14px;
            color: #333;
        }
        @media (max-width: 599px) { #subtitle .wide { display: none; } }

        /* Horizontal scroll box: on narrow screens the timeline keeps a readable
           minimum width and scrolls sideways with a visible scrollbar */
        #timeline-scroll {
            flex: none;
            overflow-x: auto;
            overflow-y: hidden;
            background: white;
            border: 1px solid silver;
            border-radius: 6px;
        }
        #timeline-scroll.scrolls { padding-bottom: 4px; }
        /* Chrome and Safari: a styled scrollbar that stays visible even where the
           system hides scrollbars until you scroll. (Setting the standard
           scrollbar-width in Chrome would switch these styles off.) */
        #timeline-scroll::-webkit-scrollbar { height: 10px; }
        #timeline-scroll::-webkit-scrollbar-track { background: #EEF0F8; }
        #timeline-scroll::-webkit-scrollbar-thumb { background: #9FA8DA; border-radius: 5px; }
        /* Firefox: the standard properties */
        @supports not selector(::-webkit-scrollbar) {
            #timeline-scroll { scrollbar-width: thin; scrollbar-color: #9FA8DA #EEF0F8; }
        }
        #timeline { min-width: 640px; }

        /* ---------- vis-timeline overrides ---------- */
        .vis-timeline { border: none; font-family: Arial, Helvetica, sans-serif; }
        /* The timeline is a fixed diagram: let the page and the scroll box handle touch panning */
        .vis-timeline, .vis-timeline * { touch-action: auto !important; }
        .vis-time-axis .vis-text { font-size: 12px; font-weight: bold; color: #555; }
        /* vis sizes each minor label to one half-day; let "Day N" run past that */
        .vis-time-axis .vis-text.vis-minor { width: auto !important; overflow: visible; }
        /* A short tick on each labeled plan day; blank half-day ticks stay invisible */
        .vis-time-axis .vis-text.vis-minor:not(:empty) { border-left: 2px solid #9FA8DA; padding: 3px 5px; }
        .vis-time-axis .vis-text.vis-minor.end-label { border-left: none; border-right: 2px solid #9FA8DA; }
        .vis-time-axis .vis-grid.vis-minor { border-color: transparent; }
        .vis-panel.vis-center, .vis-item .vis-item-overflow { overflow: visible !important; }

        /* Week blocks: solid indigo, separated by a thin white gutter */
        .vis-item.week {
            background: var(--indigo);
            border: 3px solid white;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }
        .vis-item.week:hover { background: var(--light-indigo); }
        /* Selected week: same indigo, outlined in fox-orange */
        .vis-item.week.vis-selected {
            background: var(--indigo);
            border-color: var(--fox-orange);
            box-shadow: 0 0 0 2px rgba(232, 121, 26, 0.35);
        }
        .vis-item.week.vis-selected:hover { background: var(--light-indigo); }
        .vis-item.week .vis-item-content { padding: 5px 8px; text-align: center; line-height: 1.2; white-space: nowrap; }
        .wk-name { font-size: 14px; font-weight: bold; }
        .wk-theme { font-size: 12px; }
        .wk-target { margin-top: 2px; font-size: 12px; }
        .wk-target b { font-size: 19px; }
        .vis-tooltip {
            background: #2c3e50 !important;
            color: white !important;
            padding: 6px 10px !important;
            border-radius: 6px !important;
            font-family: Arial, Helvetica, sans-serif !important;
            font-size: 13px !important;
            max-width: 280px !important;
            white-space: normal !important;
            line-height: 1.35 !important;
        }

        /* ---------- Detail panel ---------- */
        #detail {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            margin-top: 8px;
            padding: 0.55em 0.9em;
            background: white;
            border: 1px solid silver;
            border-left: 8px solid var(--indigo);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 1.35;
            color: black;
        }
        #detail .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 0.1em; }
        #detail h2 { margin: 0; font-size: 1.25em; color: var(--indigo); }
        #detail .pill {
            display: inline-block;
            padding: 0.15em 0.6em;
            border-radius: 1em;
            font-size: 0.72em;
            font-weight: bold;
            letter-spacing: 0.04em;
            color: white;
            background: var(--indigo);
        }
        #detail p { margin: 0.3em 0 0 0; }
        #detail .label { font-weight: bold; color: var(--indigo); }
        #detail .stats {
            margin-top: 0.45em;
            padding: 0.3em 0.6em;
            background: #FDF0E4;
            border-left: 4px solid var(--fox-orange);
            border-radius: 4px;
        }
        #detail .stats .label { color: var(--dark-orange); }
        #detail .ready { margin-top: 0.6em; padding-top: 0.4em; border-top: 1px solid #DDD; color: #444; font-size: 0.8em; }
        #detail .chip {
            display: inline-block;
            margin: 0.15em 0.2em 0 0;
            padding: 0.05em 0.55em;
            border: 1px solid #AAA;
            border-radius: 1em;
            color: #666;
            white-space: nowrap;
        }
        #detail .chip.done { border-color: var(--correct-green); color: var(--correct-green); font-weight: bold; }
        @media (max-width: 599px) { #detail .ready { display: none; } }

        /* Control region: white, below the drawing region */
        #controls {
            flex: none;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px;
            background: white;
            border: 1px solid silver;
            border-top: none;
        }
        #controls button { flex: none; white-space: nowrap; font-size: 16px; padding: 4px 14px; }
        #step-label { min-width: 0; font-size: 16px; color: dimgray; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
    <script src="thirty-day-launch-roadmap-timeline.js"></script>
</head>
<body>
    <main>
        <div id="sim">
            <div id="draw">
                <h1 id="title">Jordan's 30-Day Launch Roadmap</h1>
                <div id="subtitle">Each week's block shows its target<span class="wide">: dog-grooming sessions completed that week</span></div>
                <div id="timeline-scroll" role="region" aria-label="Timeline of Jordan's 30-day launch plan: four equal week blocks from Day 1 to Day 30, with weekly targets of 5, 8, 10 and 12 sessions">
                    <div id="timeline"></div>
                </div>
                <div id="detail" aria-live="polite"></div>
            </div>
            <div id="controls">
                <button id="prev-button" aria-label="Previous week">&#9664; Previous</button>
                <button id="next-button" aria-label="Next week">Next &#9654;</button>
                <span id="step-label">Week 1 of 4</span>
            </div>
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>

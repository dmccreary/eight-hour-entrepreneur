      - 2. Founder Mindset & the Cohort Learning Experience: chapters/02-founder-mindset-cohort/index.md
      - 3. The CO.STARTERS Canvas Framework: chapters/03-costarters-canvas-framework/index.md
      - 4. Customer Discovery & Segmentation: chapters/04-customer-discovery-segmentation/index.md
      - 5. Defining the Real Problem: chapters/05-defining-the-real-problem/index.md
      - 6. Designing the Solution & Initial Offer: chapters/06-designing-solution-offer/index.md
      - 7. Alternatives & the Competitive Landscape: chapters/07-alternatives-competitive-landscape/index.md
      - "8. Value Proposition: Benefit & Advantage": chapters/08-value-proposition-benefit-advantage/index.md
      - 9. Discovery Interviews & the Reality Check: chapters/09-discovery-interviews-reality-check/index.md
      - 10. Lean Testing Fundamentals: chapters/10-lean-testing-fundamentals/index.md
      - 11. Interpreting Validation Evidence: chapters/11-interpreting-validation-evidence/index.md
      - 12. Messaging & the Value Proposition Statement: chapters/12-messaging-value-proposition/index.md
      - 13. Distribution & Go-to-Market Channels: chapters/13-distribution-go-to-market/index.md
      - 14. Revenue Models & Pricing: chapters/14-revenue-models-pricing/index.md
      - 15. Startup Needs & Cost Planning: chapters/15-startup-needs-cost-planning/index.md
      - 16. Building the 30-Day Launch Plan: chapters/16-thirty-day-launch-plan/index.md
      - 17. Pitching, Accountability & What Comes Next: chapters/17-pitching-accountability-next-steps/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Mascot Rendering Test: learning-graph/mascot-test.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - 30-Day Launch Roadmap Timeline: sims/thirty-day-launch-roadmap-timeline/index.md
      - Assumption Ledger Sorter: sims/assumption-ledger-sorter/index.md
      - Benefit vs Advantage Sorter: sims/benefit-vs-advantage-sorter/index.md
      - Break-Even Calculator: sims/break-even-calculator/index.md
      - CO.STARTERS Canvas Explorer: sims/costarters-canvas-explorer/index.md
      - Cohort Safety Signal Sorter: sims/cohort-safety-signal-sorter/index.md
      - Competitive Landscape Map: sims/competitive-landscape-map/index.md
      - Customer Definition Funnel: sims/customer-definition-funnel/index.md
      - Distribution Channel Map: sims/distribution-channel-map/index.md
      - Leading vs Open-Ended Question Sorter: sims/leading-vs-open-ended-sorter/index.md
      - Minimum Testable Iteration Decision Tree: sims/minimum-testable-iteration-decision-tree/index.md
      - Minimum Viable Offer Slider: sims/minimum-viable-offer-slider/index.md
      - One-Sentence Value Proposition Builder: sims/one-sentence-value-proposition-builder/index.md
      - Persevere vs Pivot Signal Checker: sims/persevere-vs-pivot-signal-checker/index.md
      - Startup Needs Sorter: sims/startup-needs-sorter/index.md
      - Symptom vs Root Cause Drill-Down: sims/symptom-root-cause-drilldown/index.md
      - The Field Discovery Window Rhythm: sims/field-discovery-window-rhythm/index.md
      - The Four-Phase Founder Pipeline: sims/four-phase-founder-pipeline/index.md
      - The Idea Trap Cycle: sims/idea-trap-cycle/index.md
      - Two-Minute Pitch Structure and Timer: sims/two-minute-pitch-structure-timer/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'The Eight-Hour Entrepreneur'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
